name: Test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: swift test (Ubuntu)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # `diff HEAD~1` below

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-swift-6.1-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: ${{ runner.os }}-swift-6.1-spm-

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test --skip-build

      # Run the command plugin on this package: a smoke test, and the report in the job log.
      - name: Run the command plugin
        run: swift package modularity

      - name: Run diff through the command plugin
        run: |
          # The container's user does not own the checkout.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          swift package modularity diff HEAD~1

  test-macos:
    name: swift test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # `diff HEAD~1` below

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test --skip-build

      # Run the command plugin on macOS, where plugins run in the sandbox.
      - name: Run the command plugin
        run: swift package modularity

      # In the sandbox, diff exports HEAD~1 without writing to .git and takes the working tree's
      # targets from the plugin.
      - name: Run diff through the command plugin
        run: swift package modularity diff HEAD~1
